# After every push to main, tell the server to pull and rebuild (the deploy service, scripts/deploy-hook.mjs).
# Needs the repository secret DEPLOY_SECRET, the same value as in the server's .env. Run it by hand from the Actions tab.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the server to deploy
        env:
          SECRET: ${{ secrets.DEPLOY_SECRET }}
          URL: ${{ vars.DEPLOY_URL || 'https://wangleishen.com/_deploy' }}
        run: |
          [ -n "$SECRET" ] || { echo "::notice::DEPLOY_SECRET is not set, so the server was not asked to deploy."; exit 0; }
          curl -fsS --retry 3 -X POST -H "Authorization: Bearer $SECRET" "$URL"
