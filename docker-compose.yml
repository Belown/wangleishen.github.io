# The personal site: Caddy serves the built Vite app.
#   cp .env.example .env   # then edit
#   docker compose up -d --build
services:
  web:
    build: .
    restart: unless-stopped
    environment:
      SITE_USER: ${SITE_USER:-guest}
      SITE_PASSWORD: ${SITE_PASSWORD:-}
    ports:
      - "127.0.0.1:${HTTP_PORT:?set HTTP_PORT in .env}:80"
    volumes:
      - records:/srv/data:ro

  # Refreshes the Records page from Discogs every 6 hours into the volume Caddy serves at /data/.
  # Without DISCOGS_USER it only logs a reminder; the page then shows its sample layout.
  records:
    image: node:22-alpine
    restart: unless-stopped
    environment:
      DISCOGS_USER: ${DISCOGS_USER:-}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      RECORDS_DIR: /data
      RAW_DIR: /raw
      COVERS_DIR: /app/record-covers
    volumes:
      - ./scripts/discogs.mjs:/app/discogs.mjs:ro
      # Covers chosen by hand, replacing Discogs' (record-covers/<release id>.jpg).
      - ./record-covers:/app/record-covers:ro
      - records:/data
      # Every Discogs response in full, kept out of what Caddy serves.
      - records-raw:/raw
    command: ["sh", "-c", "while true; do node /app/discogs.mjs; sleep 21600; done"]

  # Auto-deploy, on the server only: docker compose --profile autodeploy up -d
  # After a push to main, GitHub Actions calls /_deploy; this pulls and rebuilds web and records (scripts/deploy-hook.mjs).
  # It drives Docker through the socket, which is root on the host: fine for a personal server, think twice elsewhere.
  deploy:
    image: node:22-alpine
    profiles: [autodeploy]
    restart: unless-stopped
    environment:
      DEPLOY_SECRET: ${DEPLOY_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    working_dir: ${PWD:?run docker compose from the repo folder}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The checkout at the same path as on the host, so the bind mounts compose sets up from here point at the right folders.
      - ${PWD}:${PWD}
    command: ["sh", "-c", "apk add --no-cache git docker-cli docker-cli-compose >/dev/null && git config --global --add safe.directory \"$$PWD\" && exec node scripts/deploy-hook.mjs"]

volumes:
  records:
  records-raw:
