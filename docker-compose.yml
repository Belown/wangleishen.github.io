# The personal site: Caddy serves the built Vite app.
#   cp .env.example .env   # then edit (optional: without it the site is public on 8081 and Records shows samples)
#   docker compose up -d
services:
  web:
    build: .
    restart: unless-stopped
    environment:
      SITE_USER: ${SITE_USER:-guest}
      SITE_PASSWORD: ${SITE_PASSWORD:-}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8081}:80"
    volumes:
      - records:/srv/data:ro

  # Refreshes the Records page from Discogs every 6 hours into the volume Caddy serves at /data/.
  # Without DISCOGS_USER it only logs a reminder; the page then shows its sample layout.
  records:
    build:
      context: .
      target: records
    restart: unless-stopped
    environment:
      DISCOGS_USER: ${DISCOGS_USER:-}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      RECORDS_DIR: /data
      RAW_DIR: /raw
      COVERS_DIR: /app/record-covers
    volumes:
      - records:/data
      # Every Discogs response in full, kept out of what Caddy serves.
      - records-raw:/raw

  # Auto-deploy: after a push to main, GitHub Actions calls https://<domain>/_deploy, and this pulls main and rebuilds
  # web and records (scripts/deploy-hook.mjs). It only acts when called, and GitHub calls the domain, so on any other
  # machine (a laptop running the site) it stays idle. It drives Docker through the socket, which is root on the host.
  deploy:
    image: node:22-alpine
    restart: unless-stopped
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    working_dir: /repo
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/repo
    command: ["sh", "-c", "apk add --no-cache git docker-cli docker-cli-compose >/dev/null && git config --global --add safe.directory /repo && exec node scripts/deploy-hook.mjs"]

volumes:
  records:
  records-raw:
